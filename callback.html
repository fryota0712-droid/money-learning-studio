<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Login | Money Learning Studio</title>
</head>
<body>
  <h1>TikTok認証が完了しました</h1>
  <p>Money Learning Studioに戻っています。</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    if (code) {
      document.body.insertAdjacentHTML(
        "beforeend",
        "<p>認証情報を受け取りました。</p>"
      );
    }
  </script>
</body>
</html>
